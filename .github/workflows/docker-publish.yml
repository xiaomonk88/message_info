name: Build & Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            slug: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            slug: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: |
          echo "IMAGE=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=message_info
            org.opencontainers.image.description=万能信息管理系统 — 动态字段 / 板块化管理 / Docker 一键部署

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slug }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish Multi-Arch Manifest & Smoke Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set lowercase image name
        run: |
          echo "IMAGE=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect published image
        run: |
          TAG=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools inspect "$TAG"
          echo "TEST_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Smoke test container startup on fresh volume
        run: |
          mkdir -p /tmp/smoke_data
          docker run -d --name message_info_smoke \
            -p 17500:8000 \
            -v /tmp/smoke_data:/data \
            -e ADMIN_USERNAME=admin \
            -e ADMIN_PASSWORD=SmokeTestPass123 \
            "${{ env.TEST_TAG }}"

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:17500/api/v1/system/health >/dev/null 2>&1; then
              echo "Healthcheck passed on attempt $i"
              break
            fi
            sleep 1
            if [ "$i" -eq 30 ]; then
              docker logs message_info_smoke
              exit 1
            fi
          done

          curl -fsS http://127.0.0.1:17500/ | grep -q "Message_Info Console"
          FONT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:17500/fonts/misans/MiSans-VF.woff2)
          test "$FONT_STATUS" = "200"
          DOCS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:17500/api/v1/docs)
          test "$DOCS_STATUS" = "404"
          test -f /tmp/smoke_data/db/app.db
          test -f /tmp/smoke_data/secrets/jwt_secret
          test -f /tmp/smoke_data/secrets/encryption_key
          docker rm -f message_info_smoke
